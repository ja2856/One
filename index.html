<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Pomodoro Timer</h1>

    <div class="mode-selector">
      <button class="mode-btn active" data-mode="work">Work</button>
      <button class="mode-btn" data-mode="short-break">Short Break</button>
      <button class="mode-btn" data-mode="long-break">Long Break</button>
    </div>

    <div class="timer-display">
      <div class="time" id="time">25:00</div>
      <div class="session-info" id="session-info">Session 1 of 4</div>
    </div>

    <div class="controls">
      <button class="control-btn" id="startBtn">Start</button>
      <button class="control-btn" id="resetBtn">Reset</button>
    </div>

    <div class="settings">
      <div class="setting-item">
        <label>Work Duration (min):</label>
        <input type="number" id="workDuration" value="25" min="1" max="60">
      </div>
      <div class="setting-item">
        <label>Short Break (min):</label>
        <input type="number" id="shortBreakDuration" value="5" min="1" max="30">
      </div>
      <div class="setting-item">
        <label>Long Break (min):</label>
        <input type="number" id="longBreakDuration" value="15" min="1" max="60">
      </div>
      <div class="setting-item">
        <label>
          <input type="checkbox" id="autoStartBreaks" checked>
          Auto-start breaks
        </label>
      </div>
      <div class="setting-item">
        <label>
          <input type="checkbox" id="autoStartPomodoros">
          Auto-start pomodoros
        </label>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
